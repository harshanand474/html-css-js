<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
      <div class="choice" id="rock">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUW2Lq0b5Zq3sdBYr5iifNkjgWAQ9IzQxR2w&s" />
      </div>
      <div class="choice" id="paper">
        <img src="https://www.shutterstock.com/shutterstock/photos/160446689/display_1500/stock-vector-hand-sign-of-rock-paper-scissors-game-isolated-vector-on-white-background-160446689.jpg" />
      </div>
      <div class="choice" id="scissors">
        <img src="https://www.shutterstock.com/image-vector/hand-sign-rock-paper-scissors-260nw-160446680.jpg" />
      </div>
    </div>

    <div class="score-board">
      <div class="score">
        <p id="user-score">0</p>
        <p>You</p>
      </div>
      <div class="score">
        <p id="comp-score">0</p>
        <p>Comp</p>
      </div>
    </div>

    <div class="msg-container">
      <p id="msg">Play your move</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
